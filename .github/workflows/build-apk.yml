name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # Actions ট্যাব থেকে "Run workflow" চেপে হাতে চালানোও যাবে

permissions:
  contents: write           # "latest" রিলিজে APK রাখার জন্য

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # package.json যে ফোল্ডারেই থাকুক (রুটে বা ভেতরের ফোল্ডারে), নিজে খুঁজে নেবে
      - name: প্রজেক্ট ফোল্ডার খোঁজা
        run: |
          F=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$F" ]; then
            echo "Error: package.json পাওয়া যায়নি। রিপোতে আছে:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(cd "$(dirname "$F")" && pwd)
          echo "প্রজেক্ট ফোল্ডার: $DIR"
          ls -la "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub-এর ubuntu রানারে Android SDK আগে থেকেই আছে; শুধু লাইসেন্স মেনে নেওয়া
      - name: Android SDK লাইসেন্স
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle ক্যাশ
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: নির্ভরতা ইনস্টল
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: অ্যান্ড্রয়েড প্রজেক্ট তৈরি (setup.js)
        working-directory: ${{ env.PROJECT_DIR }}
        run: node setup.js

      - name: APK বিল্ড
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK-র নাম ঠিক করা
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" dujone.apk
          ls -lh dujone.apk

      - name: Artifact আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: dujone-debug-apk
          path: ${{ env.PROJECT_DIR }}/dujone.apk
          if-no-files-found: error

      # ফোন থেকে সরাসরি ডাউনলোড করার লিংক: Releases → "latest"
      - name: latest রিলিজে APK রাখা
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dujone.apk --prerelease \
            --title "দুজনে — সর্বশেষ APK" \
            --notes "কমিট: ${GITHUB_SHA::7} — এটা ডিবাগ APK (টেস্ট/ব্যক্তিগত ব্যবহারের জন্য)।"

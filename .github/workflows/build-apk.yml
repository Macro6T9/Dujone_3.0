name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          set -e
          ROOT="$PWD"
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found - files missing in upload. Repo contains:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          cd "$(dirname "$PKG")"
          pwd
          for f in setup.js capacitor.config.json src/index.original.html native/MainActivity.java signing/dujone-debug.keystore; do
            [ -e "$f" ] || { echo "::error::$f missing in upload"; exit 1; }
          done
          npm install --no-audit --no-fund
          node setup.js
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$ROOT/dujone.apk"
          ls -lh "$ROOT/dujone.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dujone-debug-apk
          path: dujone.apk
          if-no-files-found: error

      - name: Publish latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dujone.apk --prerelease --title "Dujone latest APK" --notes "Debug APK, commit ${GITHUB_SHA::7}"
          

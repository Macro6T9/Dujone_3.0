name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          unzip -q "Dujone 3.0.zip" -d project
          cd project
          # zip-এর ভেতরে যদি একটাই ফোল্ডার থাকে, সেটার ভেতরে ঢুকবে
          if [ ! -f package.json ] && [ "$(ls | wc -l)" = "1" ]; then cd */; fi
          if [ ! -f package.json ]; then
            echo "Error: package.json not found inside zip. Contents:"
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm ci || npm install
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
